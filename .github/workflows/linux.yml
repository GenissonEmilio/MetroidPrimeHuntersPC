name: Linux build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Native dependencies for hidden runtime checks
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenal1 libgl1-mesa-dri libxrandr2 libxinerama1 libxcursor1 libxi6 xvfb pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=hunters_test
          pactl set-default-sink hunters_test
      - name: Unit checks without game data
        run: dotnet run --project tests/PcChecks/PcChecks.csproj -c Release
      - name: Package and installer regression checks
        run: python3 -m unittest discover -s tests -p 'test_*package.py'
      - name: Build and audit Linux package
        run: python3 scripts/package-linux.py
      - name: Check packaged menu and audio on Mesa
        run: |
          mkdir -p local/package-test
          tar -xzf artifacts/v0.3.0/*-linux-x64.tar.gz -C local/package-test
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null HUNTERSPC_DATA_DIR="$PWD/local/test-data" \
            ./local/package-test/HuntersPC/HuntersPC.sh --pc-smoke "$PWD/evidence/linux-smoke"
      - uses: actions/upload-artifact@v7
        with:
          name: HuntersPC-linux-x64
          path: |
            artifacts/v0.3.0/*
            evidence/linux-smoke/*
          if-no-files-found: error
