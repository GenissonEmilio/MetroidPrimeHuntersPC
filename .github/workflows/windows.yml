name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Unit checks without game data
        run: dotnet run --project tests/PcChecks/PcChecks.csproj -c Release
      - name: Package audit regression checks
        run: python -m unittest discover -s tests -p test_windows_package.py
      - name: Build and audit Windows package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: HuntersPC-windows-x64
          path: artifacts/v0.1.0-alpha.1/*
          if-no-files-found: error
